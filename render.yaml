services:
  - type: web
    name: b2b-lead-generation-agent
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEFAULT_DAILY_TOKEN_LIMIT
        value: "500000"

      # Database Configuration (Uses local sqlite by default)
      - key: DATABASE_URL
        value: sqlite:///./lead_gen.db

      # Webshare Rotating Proxies (Automatic IP failover & anti-block)
      - key: WEBSHARE_PROXIES
        value: "45.38.107.97:6014:ndmcilxj:itztvi7o8gz9;64.137.96.74:6641:ndmcilxj:itztvi7o8gz9;198.23.243.226:6361:ndmcilxj:itztvi7o8gz9;38.154.185.97:6370:ndmcilxj:itztvi7o8gz9;84.247.60.125:6095:ndmcilxj:itztvi7o8gz9;191.96.254.138:6185:ndmcilxj:itztvi7o8gz9;198.46.161.42:5092:ndmcilxj:itztvi7o8gz9;64.137.10.153:5803:ndmcilxj:itztvi7o8gz9;104.164.49.38:7693:ndmcilxj:itztvi7o8gz9;23.26.71.145:5628:ndmcilxj:itztvi7o8gz9"

      # Groq API Keys (Configure these in your Render Environment Variables)
      - key: GROQ_API_KEY_1
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_API_KEY_4
        sync: false
      - key: GROQ_API_KEY_5
        sync: false

      # Gemini API Keys (Configure these in your Render Environment Variables)
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_API_KEY_4
        sync: false
      - key: GEMINI_API_KEY_5
        sync: false

      # Optional DeepSeek API Key
      - key: DEEPSEEK_API_KEY
        sync: false

      # Optional MUSE AI API Key for Securing Endpoints (Set in Render Dashboard if desired)
      - key: MUSE_API_KEY
        sync: false


